services:
  - type: web
    name: ai-nurse-scheduling
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.production
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-nurse-scheduling-db-v2
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: STAFF_INITIAL_PASSWORD
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

databases:
  - name: ai-nurse-scheduling-db-v2
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    databaseName: nurse_schedule_db_v2
    user: nurse_app
    ipAllowList: []
